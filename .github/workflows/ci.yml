name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - ccr-63b8112a-e2uk2g # the deploy branch is gated by the host pipeline itself

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Non-blocking: warns on the PR when engine rules files changed since the training-only GPU mirror
      # (packages/delove-gpu) was last verified. It never fails the build; verify.py on the training PC clears it.
      - name: GPU mirror freshness (warning only)
        if: always()
        run: python3 packages/delove-gpu/delove_gpu/fingerprint.py check --github
      # Non-blocking: the map status table (registered, GPU mirror wiring, GPU-verified, training rotation) goes to the
      # job summary, with a warning per offered map the GPU mirror is not verified on. Never fails the build.
      - name: Map status (warning only)
        if: always()
        run: |
          node scripts/map-status.mjs --markdown >> "$GITHUB_STEP_SUMMARY" || true
          node scripts/map-status.mjs --github || true
