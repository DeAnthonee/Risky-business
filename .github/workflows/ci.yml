name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - ccr-63b8112a-e2uk2g # the deploy branch is gated by the host pipeline itself

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
